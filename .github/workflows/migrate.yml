# Applies new SQL migrations to the production Supabase project whenever they land on main,
# so no agent or human needs database credentials locally.
# Needs repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, and variable SUPABASE_PROJECT_REF.
name: Migrate database
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrate
  cancel-in-progress: false
jobs:
  migrate:
    # Only code that is already on main may reach production secrets (also for manual runs).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      # Secrets only on the steps that need them, never on third-party actions.
      - run: supabase link --project-ref "$PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
