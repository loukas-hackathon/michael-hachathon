# Deploys the API to Railway on every merge to main that touches API code, so deploys never
# depend on who merged (no Railway seat or manual approval needed).
# Needs repo secret RAILWAY_TOKEN: a Railway *project* token for project "michael", environment production.
name: Deploy API
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "railway.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-api
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli@5.74.0
      # CLI uploads carry no git metadata, so record the SHA for /health first. WEB_URL (where
      # Google sends the browser back after Connect Google Calendar) and PUBLIC_WEB_URL (the
      # Claude connector's consent page) are the Vercel app, as on Sunday 15 Nov when all worked.
      # Moving the web app (#550) means changing them here.
      - run: >-
          railway variables --service api --set "GIT_COMMIT_SHA=$GITHUB_SHA"
          --set "WEB_URL=https://michael-zeta-sand.vercel.app"
          --set "PUBLIC_WEB_URL=https://michael-zeta-sand.vercel.app" --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api-production-16521a26.up.railway.app/health | grep -q "\"commit\":\"${GITHUB_SHA:0:7}\""; then echo "live: ${GITHUB_SHA:0:7}"; exit 0; fi
            sleep 10
          done
          exit 1
