# Merges every open, non-draft PR as soon as CI is green and it has no conflicts, so nobody
# merges or verifies by hand. Opt out with the `wip` label or by opening the PR as a draft.
# Merges made with GITHUB_TOKEN do not trigger push workflows, so this workflow dispatches
# Deploy API and Migrate database itself when merged PRs touched their paths.
name: Auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge ready PRs
        run: |
          set -u
          deploy_api=false
          migrate=false
          # Only same-repo PRs (no forks: the repo is public) by people with write access.
          prs=$(gh pr list -R "$REPO" --state open --json number,isDraft,labels,mergeable,isCrossRepository,headRefOid,author \
            --jq '.[] | select(.isDraft | not) | select(.isCrossRepository | not) | select([.labels[].name] | index("wip") | not) | "\(.number) \(.mergeable) \(.headRefOid) \(.author.login)"')
          while read -r n state sha author; do
            [ -z "${n:-}" ] && continue
            perm=$(gh api "repos/$REPO/collaborators/$author/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in admin|maintain|write) ;; *) continue ;; esac
            if [ "$state" = "CONFLICTING" ]; then
              if ! gh pr view "$n" -R "$REPO" --json comments --jq '.comments[].body' | grep -q "auto-merge: conflicts"; then
                gh pr comment "$n" -R "$REPO" --body "auto-merge: conflicts with main. Author agent: run \`git pull origin main\`, fix, push; I merge once CI is green."
              fi
              continue
            fi
            # Every check must have finished successfully (skipped/neutral are fine).
            pending=$(gh pr view "$n" -R "$REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select((.status // "COMPLETED") != "COMPLETED")] | length')
            failed=$(gh pr view "$n" -R "$REPO" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.conclusion != null and (.conclusion | IN("SUCCESS","SKIPPED","NEUTRAL") | not))] | length')
            ci=$(gh pr view "$n" -R "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | select(.name == "check")] | length')
            if [ "$pending" != "0" ] || [ "$failed" != "0" ] || [ "$ci" = "0" ]; then continue; fi
            files=$(gh pr diff "$n" -R "$REPO" --name-only)
            # CI checked migration order against main as it was then; main may have moved since (#178).
            added=$(echo "$files" | grep -oE '^supabase/migrations/[0-9]{14}_[^/]+\.sql$' | xargs -r -n1 basename || true)
            if [ -n "$added" ]; then
              on_main=$(gh api "repos/$REPO/contents/supabase/migrations?ref=main" --jq '.[].name' || true)
              newest=$(echo "$on_main" | grep -oE '^[0-9]{14}' | sort | tail -1 || true)
              late=$(echo "$added" | grep -vxF -f <(echo "$on_main") | awk -v max="$newest" 'substr($0,1,14) <= max' || true)
              if [ -n "$late" ]; then
                if ! gh pr view "$n" -R "$REPO" --json comments --jq '.comments[].body' | grep -q "auto-merge: migration order"; then
                  gh pr comment "$n" -R "$REPO" --body "auto-merge: migration order. Main now has $newest; rename $(echo $late) to a later timestamp, push, and I merge once CI is green."
                fi
                continue
              fi
            fi
            # --match-head-commit: refuse if new commits arrived after the checks we just read.
            if gh pr merge "$n" -R "$REPO" --squash --delete-branch --match-head-commit "$sha"; then
              echo "merged #$n"
              # Bot merges do not trigger GitHub's "Closes #n" auto-close, so close linked issues here.
              for i in $(gh pr view "$n" -R "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
                gh issue close "$i" -R "$REPO" --comment "Closed by #$n (auto-merged)." || true
                gh issue edit "$i" -R "$REPO" --remove-label in-progress || true
              done
              echo "$files" | grep -qE '^(apps/api/|packages/shared/|pnpm-lock.yaml$|package.json$|railway.json$)' && deploy_api=true
              echo "$files" | grep -qE '^supabase/migrations/' && migrate=true
            fi
          done <<< "$prs"
          if [ "$migrate" = true ]; then gh workflow run migrate.yml -R "$REPO" --ref main; fi
          if [ "$deploy_api" = true ]; then gh workflow run deploy-api.yml -R "$REPO" --ref main; fi
